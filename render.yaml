services:
  - type: web
    name: insaaf-ai-backend
    runtime: python
    region: oregon
    plan: starter
    buildCommand: cd backend && pip install --no-cache-dir -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: yes
    envVars:
      - key: PORT
        value: "10000"
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: USE_HF_API
        sync: false
      - key: HF_API_TOKEN
        sync: false
